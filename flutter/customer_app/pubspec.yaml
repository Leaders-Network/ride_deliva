name: customer_app
description: "Ride Deliva Customer App - Book rides and deliveries with ease"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  # State Management
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  
  # Network & API
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^10.1.1
  geocoding: ^3.0.0
  
  # Real-time Communication
  socket_io_client: ^2.0.3+1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Image & Media
  image_picker: ^1.0.8
  cached_network_image: ^3.3.1
  
  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  
  # Firebase (for push notifications)
  firebase_core: ^2.31.1
  firebase_messaging: ^14.9.4
  
  # Other
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
