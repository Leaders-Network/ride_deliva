$kind: http-request
method: GET
url: '{{baseUrl}}/payments?page=1&limit=5'
order: 6000
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '5'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('paginated envelope', () => {
        const b = pm.response.json();
        pm.expect(b.data).to.be.an('array');
        pm.expect(b.meta).to.include.keys('page', 'limit', 'total', 'totalPages', 'hasNext', 'hasPrev');
        pm.expect(b.data.length).to.be.at.most(b.meta.limit);
      });
      pm.test('newest first, includes the payment just started', () => {
        const ids = pm.response.json().data.map((p) => p.id);
        pm.expect(ids).to.include(pm.collectionVariables.get('paymentId'));
      });
examples: './.resources/List my payments.resources/examples'
