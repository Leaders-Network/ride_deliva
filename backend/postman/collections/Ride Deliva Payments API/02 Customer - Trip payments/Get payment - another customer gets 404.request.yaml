$kind: http-request
method: GET
url: '{{baseUrl}}/payments/{{paymentId}}'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{otherCustomerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('error message matches /payment not found/i', () => pm.expect(pm.response.json().error.message).to.match(/payment not found/i));
