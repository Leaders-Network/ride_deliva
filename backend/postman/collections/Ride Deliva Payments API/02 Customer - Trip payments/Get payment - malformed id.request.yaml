$kind: http-request
method: GET
url: '{{baseUrl}}/payments/not-a-uuid'
order: 11000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('details name the id field', () => pm.expect(pm.response.json().error.details[0].field).to.eql('id'));
