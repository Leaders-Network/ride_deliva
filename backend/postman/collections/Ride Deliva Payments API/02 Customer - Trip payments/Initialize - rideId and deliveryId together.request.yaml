$kind: http-request
method: POST
url: '{{baseUrl}}/payments/initialize'
order: 9000
body:
  type: json
  content: |-
    {
      "rideId": "{{rideId}}",
      "deliveryId": "{{rideId}}"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{otherCustomerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('error code is VALIDATION_ERROR', () => pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR'));
examples: './.resources/Initialize - rideId and deliveryId together.resources/examples'
