$kind: http-request
method: POST
url: '{{baseUrl}}/payments/initialize'
order: 10000
body:
  type: json
  content: |-
    {
      "rideId": "{{rideId}}",
      "method": "CASH"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{otherCustomerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('details name the method field', () => pm.expect(pm.response.json().error.details.map((d) => d.field)).to.include('method'));
