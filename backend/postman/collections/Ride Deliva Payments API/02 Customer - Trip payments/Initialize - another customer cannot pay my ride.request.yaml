$kind: http-request
description: |-
  "Not yours" is indistinguishable from "does not exist" (404), so trip ids cannot be probed.
method: POST
url: '{{baseUrl}}/payments/initialize'
order: 7000
body:
  type: json
  content: |-
    {
      "rideId": "{{rideId}}",
      "method": "CARD"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{otherCustomerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('error message matches /ride not found/i', () => pm.expect(pm.response.json().error.message).to.match(/ride not found/i));
