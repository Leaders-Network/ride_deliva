$kind: http-request
method: PUT
url: '{{baseUrl}}/payments/admin/settings'
order: 3000
body:
  type: json
  content: |-
    {
      "commissionRate": {{originalCommissionRate}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('restored', () => pm.expect(String(pm.response.json().data.commissionRate)).to.eql(pm.collectionVariables.get('originalCommissionRate')));
