$kind: http-request
description: |-
  Only FAILED or REVERSED payouts can be retried (409 otherwise).
method: POST
url: '{{baseUrl}}/payments/admin/payouts/{{randomUuid}}/retry'
order: 11000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set('randomUuid', crypto.randomUUID ? crypto.randomUUID() : '6f1c2a3e-8b7d-4c1e-9f0a-1b2c3d4e5f60');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('error message matches /payout not found/i', () => pm.expect(pm.response.json().error.message).to.match(/payout not found/i));
