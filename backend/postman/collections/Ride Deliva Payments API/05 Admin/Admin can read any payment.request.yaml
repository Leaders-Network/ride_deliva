$kind: http-request
method: GET
url: '{{baseUrl}}/payments/{{paymentId}}'
order: 13000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('same payment', () => pm.expect(pm.response.json().data.id).to.eql(pm.collectionVariables.get('paymentId')));
