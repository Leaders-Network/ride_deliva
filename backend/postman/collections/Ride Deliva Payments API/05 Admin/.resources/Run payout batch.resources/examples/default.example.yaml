$kind: http-example
name: 'Batch summary'
request:
  url: '{{baseUrl}}/payments/admin/payouts/run'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Payout batch run",
        "data": {
          "batchKey": "2026-11-25",
          "eligible": 0,
          "created": 0,
          "paid": 0,
          "processing": 0,
          "failed": 0,
          "skipped": 0
        },
        "timestamp": "2026-11-25T09:00:00.000Z"
      }
