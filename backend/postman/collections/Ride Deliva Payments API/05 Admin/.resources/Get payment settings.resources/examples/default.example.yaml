          "id": "default",
          "commissionRate": "0.2",
          "momoCashbackEnabled": false,
          "momoCashbackRate": "0.02",
          "momoCashbackCap": "500",
          "momoCashbackMinFare": "1000",
          "payoutMinimum": "1000",
          "updatedBy": null,
          "updatedAt": "2026-11-25T09:00:00.000Z"
        },
        "timestamp": "2026-11-25T09:00:00.000Z"
      }
