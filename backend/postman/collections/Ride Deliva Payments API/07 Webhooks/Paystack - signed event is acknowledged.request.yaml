$kind: http-request
method: POST
url: '{{baseUrl}}/webhooks/paystack'
order: 2000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: text
  content: |-
    {{webhookBody}}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const secret = pm.environment.get('paystackSecretKey');
      const ref = 'postman-' + Date.now();
      pm.collectionVariables.set('webhookRef', ref);
      const raw = JSON.stringify({ event: 'postman.ping', data: { reference: ref } });
      pm.collectionVariables.set('webhookRaw', raw);
      pm.variables.set('webhookBody', raw);
      if (secret) pm.request.headers.upsert({ key: 'x-paystack-signature', value: CryptoJS.HmacSHA512(raw, secret).toString(CryptoJS.enc.Hex) });
  - type: afterResponse
    language: text/javascript
    code: |-
      if (!pm.environment.get('paystackSecretKey')) {
        pm.test.skip('needs paystackSecretKey in the environment', () => {});
      } else {
        pm.test('status is 200', () => pm.response.to.have.status(200));
        pm.test('acknowledged, first delivery', () => pm.expect(pm.response.json()).to.eql({ received: true }));
      }
examples: './.resources/Paystack - signed event is acknowledged.resources/examples'
