$kind: http-request
method: PUT
url: '{{baseUrl}}/webhooks/momo/{{randomUuid}}/forged'
order: 5000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "status": "SUCCESSFUL"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set('randomUuid', crypto.randomUUID ? crypto.randomUUID() : '6f1c2a3e-8b7d-4c1e-9f0a-1b2c3d4e5f60');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('empty body reveals nothing', () => pm.expect(pm.response.text()).to.eql(''));
