    type: json
    content: |-
      {
        "success": true,
        "message": "Earnings retrieved",
        "data": {
          "balance": "12500",
          "currency": "NGN",
          "trips": 1,
          "gross": "2300",
          "commission": "460",
          "net": "1840",
          "payoutMinimum": "1000",
          "payoutSchedule": "0 6 * * 1",
          "payoutAccount": null,
          "lastPayout": null
        },
        "timestamp": "2026-11-25T09:00:00.000Z"
      }
