$kind: http-request
method: GET
url: '{{baseUrl}}/payments/wallet'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('NGN wallet', () => pm.expect(pm.response.json().data.currency).to.eql('NGN'));
