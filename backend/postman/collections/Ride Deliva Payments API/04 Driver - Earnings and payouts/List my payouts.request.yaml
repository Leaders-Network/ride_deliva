$kind: http-request
method: GET
url: '{{baseUrl}}/payments/payouts'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('paginated envelope', () => {
        const b = pm.response.json();
        pm.expect(b.data).to.be.an('array');
        pm.expect(b.meta).to.include.keys('page', 'limit', 'total', 'totalPages', 'hasNext', 'hasPrev');
        pm.expect(b.data.length).to.be.at.most(b.meta.limit);
      });
