$kind: http-request
method: GET
url: '{{baseUrl}}/payments/payout-account'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const a = pm.response.json().data;
      pm.test('null, or an account without the Paystack recipient code', () => {
        if (a !== null) {
          pm.expect(a).to.include.keys('type', 'accountNumber', 'bankName', 'accountName');
          pm.expect(a).to.not.have.property('recipientCode');
        }
      });
