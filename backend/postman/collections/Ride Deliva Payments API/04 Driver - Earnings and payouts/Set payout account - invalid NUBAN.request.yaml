$kind: http-request
method: PUT
url: '{{baseUrl}}/payments/payout-account'
order: 5000
body:
  type: json
  content: |-
    {
      "type": "BANK",
      "accountNumber": "12345",
      "bankCode": "058"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('explains the NUBAN rule', () => pm.expect(pm.response.json().error.details[0].message).to.match(/10-digit NUBAN/));
examples: './.resources/Set payout account - invalid NUBAN.resources/examples'
