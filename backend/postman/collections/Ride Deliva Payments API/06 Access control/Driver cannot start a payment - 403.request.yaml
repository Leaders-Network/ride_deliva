$kind: http-request
method: POST
url: '{{baseUrl}}/payments/initialize'
order: 4000
body:
  type: json
  content: |-
    {
      "rideId": "{{rideId}}"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{driverToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 403', () => pm.response.to.have.status(403));
