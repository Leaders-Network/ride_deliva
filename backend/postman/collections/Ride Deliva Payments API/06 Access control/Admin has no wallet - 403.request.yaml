$kind: http-request
method: GET
url: '{{baseUrl}}/payments/wallet'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 403', () => pm.response.to.have.status(403));
      pm.test('error message matches /customers and drivers/i', () => pm.expect(pm.response.json().error.message).to.match(/customers and drivers/i));
