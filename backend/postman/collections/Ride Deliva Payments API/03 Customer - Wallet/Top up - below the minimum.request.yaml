$kind: http-request
method: POST
url: '{{baseUrl}}/payments/wallet/top-up'
order: 4000
body:
  type: json
  content: |-
    {
      "amount": 50,
      "method": "CARD"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{otherCustomerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422', () => pm.response.to.have.status(422));
      pm.test('details name the amount field', () => pm.expect(pm.response.json().error.details[0].field).to.eql('amount'));
