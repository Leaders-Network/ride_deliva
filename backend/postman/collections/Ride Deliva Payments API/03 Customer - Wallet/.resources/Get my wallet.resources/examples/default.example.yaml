$kind: http-example
name: 'Wallet'
request:
  url: '{{baseUrl}}/payments/wallet'
  method: GET
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Wallet retrieved",
        "data": {
          "id": "c3d4e5f6-0000-4000-8000-000000000001",
          "balance": "5000",
          "currency": "NGN",
          "isActive": true,
          "updatedAt": "2026-11-25T09:00:00.000Z"
        },
        "timestamp": "2026-11-25T09:00:00.000Z"
      }
