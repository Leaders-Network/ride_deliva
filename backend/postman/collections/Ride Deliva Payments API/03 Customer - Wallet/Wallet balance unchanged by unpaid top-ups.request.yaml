$kind: http-request
description: |-
  Starting a top-up must not credit anything: only a verified provider result does.
method: GET
url: '{{baseUrl}}/payments/wallet'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('balance equals the balance before the top-ups', () => pm.expect(String(pm.response.json().data.balance)).to.eql(pm.collectionVariables.get('customerBalance')));
