name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', 'package.json', 'package-lock.json', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'package.json', 'package-lock.json', '.github/workflows/backend.yml']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Unit tests mock PostgreSQL and Redis, so no service containers are needed yet.
    # These are throwaway values that satisfy config validation (src/config/index.ts).
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ride_deliva_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars
      ENCRYPTION_KEY: ci-only-encryption-key-32-characters

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # The repo is an npm workspace, so install from the root
      - name: Install dependencies
        run: npm ci
        working-directory: .

      # src/generated/prisma is gitignored; tests and the build both import it
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand --watch=false

      - name: Build
        run: npm run build
